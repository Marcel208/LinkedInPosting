<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Rebrand Reveal</title>
<style>
  @font-face { font-family: "Lora"; src: url(fonts/Lora.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Lora"; src: url(fonts/Lora-Italic.woff2) format("woff2"); font-weight: 400 700; font-style: italic; }
  @font-face { font-family: "Noto Sans"; src: url(fonts/NotoSans.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
  #acc { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<canvas id="acc" width="1080" height="1080"></canvas>
<script>
// ===========================================================================
// 5D INSTITUT → NEUER NAME. Reveal-Clip, 16 s, 120-BPM-Raster.
// Story: 1D → 2D → 3D → 4D (Zeit) → 5D (Kosten) → Logo → 6D, 7D … ∞D →
// Tesserakt → Blackout → Name. Der Ring aus dem 5D°-Logo wird das „O" im
// neuen Namen. Namen ändern: CONFIG.newName (letzter Buchstabe = der Ring,
// wenn ringAsLastLetter true ist).
// ===========================================================================
const CONFIG = {
  newName: "DIMENSIO",
  ringAsLastLetter: true,
  tagline: "Bauen in allen Dimensionen.",
  formerly: "vormals 5D Institut",
  url: "5d-institut.de",
  dims: [["1D", "Punkt."], ["2D", "Fläche."], ["3D", "Raum."], ["4D", "Zeit."], ["5D", "Kosten."]],
  oldName: ["5D", "INSTITUT"],
  since: "Fünf Dimensionen. Seit 2016.",
  flips: [[6.0, "6", "Nachhaltigkeit"], [6.35, "7", "Betrieb"], [6.6, "8", ""], [6.78, "9", ""], [6.92, "12", ""],
          [7.04, "27", ""], [7.14, "99", ""], [7.24, "∞", ""]],
  more: "Bauen hat mehr Dimensionen.",
  words: ["Daten.", "Prozesse.", "KI.", "Menschen."],
  newNameLead: ["Zeit für einen", "neuen Namen."],
  floors: ["1,2 Mio €", "0,9 Mio €", "1,1 Mio €", "0,8 Mio €"],
  total: 4.0,
};

const DURATION = 16;
const W = 1080, H = 1080, CX = W / 2, CY = H / 2;
const BG = "#0a0a0e", WHITE = "#f4f2f3", ACC = "#e63950", RED = "#9b1c36", MUTED = "rgba(244,242,243,0.55)";
const SANS = "'Noto Sans'", SERIF = "Lora";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOut5 = x => 1 - Math.pow(1 - x, 5);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = (x, c1 = 1.7) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .25, fo = .25) => Math.min(easeOut(prog(t, a, a + fi)), 1 - easeIn(prog(t, b - fo, b)));
const bump = (t, a, d) => Math.max(0, Math.sin(prog(t, a, a + d) * Math.PI));
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function fill(c) { ctx.fillStyle = c; ctx.fillRect(-W, -H, W * 3, H * 3); }
function chroma(text, x, y, font, color, ab = 0, align = "center", spacing = 0) {
  ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.letterSpacing = spacing + "px";
  if (ab > .3) {
    ctx.globalAlpha *= .7;
    ctx.fillStyle = "#ff1e5a"; ctx.fillText(text, x - ab, y);
    ctx.fillStyle = "#1ee6ff"; ctx.fillText(text, x + ab, y + ab * .25);
    ctx.globalAlpha /= .7;
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}
function reveal(text, x, y, k, font, color, align = "center", spacing = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.font = font; ctx.letterSpacing = spacing + "px"; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(text), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const x0 = align === "center" ? x - m.width / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 30, y - asc - 14, m.width + 60, asc + desc + 28); ctx.clip();
  ctx.globalAlpha *= clamp(k * 1.5); ctx.fillStyle = color;
  ctx.fillText(text, x, y + (1 - easeOut5(k)) * (asc + desc + 20));
  ctx.restore();
}

// ---------- backdrop: blueprint grid ----------
function backdrop(t, a = 1) {
  fill(BG);
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = "rgba(255,255,255,0.045)"; ctx.lineWidth = 1;
  const off = (t * 12) % 60;
  for (let x = -60 + off; x < W + 60; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -60 + off * .5; y < H + 60; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  for (let x = -240 + (off * 4) % 240; x < W + 240; x += 240) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.restore();
}
function vignette(dark = .6) {
  const g = ctx.createRadialGradient(CX, CY, 360, CX, CY, 800);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${dark})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glow(x, y, r, color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
}

// ---------- 3D ----------
function makeCam(yaw, pitch, dist, fov, cx = CX, cy = CY) {
  const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  return p => {
    const x1 = p[0] * cy_ - p[2] * sy, z1 = p[0] * sy + p[2] * cy_;
    const y2 = p[1] * cp - z1 * sp, z2 = p[1] * sp + z1 * cp;
    const s = fov / (z2 + dist);
    return [cx + x1 * s, cy - y2 * s, z2];
  };
}
function line3(P, a, b, k = 1) {
  const p = P(a), q = P(b);
  ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(lerp(p[0], q[0], k), lerp(p[1], q[1], k)); ctx.stroke();
}
function poly3(P, pts) {
  ctx.beginPath(); pts.forEach((p, i) => { const s = P(p); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath();
}

// building: 4 × 3 footprint, 4 floors, a few interior walls
const BX = 2, BZ = 1.5, FLOORS = 4;
const WALLS = [[[0, -BZ], [0, BZ]], [[0, 0], [BX, 0]], [[-1, -BZ], [-1, 0]], [[-BX, .6], [0, .6]]];
const OUTLINE = [[-BX, -BZ], [BX, -BZ], [BX, BZ], [-BX, BZ]];

// ===========================================================================
// scene 1: dimensions 1D – 5D
// ===========================================================================
const SFX = [];
const cue = (t, type, extra = {}) => SFX.push({ t, type, ...extra });
cue(0, "riser", { dur: .4 });
[.4, 1.0, 1.5, 2.5, 3.5].forEach((h, i) => cue(h, "hit", { tone: i }));
cue(1.0, "whoosh", { dur: .4, soft: true }); cue(1.5, "whoosh", { dur: .6 });
for (let i = 0; i < 8; i++) cue(2.5 + i * .125, "clock", { p: i % 2 });
CONFIG.floors.forEach((_, i) => cue(3.55 + i * .17, "coin", { p: i }));
cue(4.2, "count", { dur: .35 }); cue(4.45, "whoosh", { dur: .5 }); cue(5.0, "impact", { soft: true });

function dimLabel(t) {
  const i = CONFIG.dims.findIndex((_, j) => t < [1.0, 1.5, 2.5, 3.5, 4.5][j]);
  if (i < 0 || t < .4) return;
  const s = [.4, 1.0, 1.5, 2.5, 3.5][i], k = easeOut5(prog(t, s, s + .18));
  const out = easeIn(prog(t, 4.35, 4.55));
  ctx.save(); ctx.globalAlpha = 1 - out;
  ctx.translate(90, 210); ctx.scale(lerp(1.6, 1, k), lerp(1.6, 1, k));
  chroma(CONFIG.dims[i][0], 0, 0, `200 150px ${SANS}`, WHITE, 10 * (1 - prog(t, s, s + .3)), "left");
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 - out;
  reveal(CONFIG.dims[i][1], 96, 270, prog(t, s + .05, s + .3), `italic 600 44px ${SERIF}`, ACC, "left");
  // progress pips 1..5
  for (let j = 0; j < 5; j++) {
    ctx.fillStyle = j <= i ? ACC : "rgba(255,255,255,0.18)";
    ctx.fillRect(96 + j * 34, 300, 24, 4);
  }
  ctx.restore();
}

function sceneDims(t) {
  backdrop(t);
  const collapse = easeIn(prog(t, 4.45, 4.95));
  // camera: top view for 1D/2D, tilts to isometric for 3D
  const tilt = easeInOut(prog(t, 1.5, 2.3));
  const yaw = lerp(0, -.6, tilt) - (t > 2.3 ? (t - 2.3) * .35 : 0) - collapse * 4;
  const pitch = lerp(Math.PI / 2 - .001, .5, tilt);
  const scale = lerp(1, 1.0, tilt) * (1 - collapse);
  const P = makeCam(yaw, pitch, 14, 1550 * scale, CX + 120, 610 + tilt * 60);
  const h = FLOORS * easeOut(prog(t, 1.6, 2.4));
  ctx.save(); ctx.lineCap = "round";
  // 1D: point
  const pk = easeBack(prog(t, .4, .6), 3);
  if (t < 1.4 && pk > 0) {
    const [px, py] = P([0, 0, 0]);
    glow(px, py, 120, "rgba(230,57,80,0.9)", pk * (1 - prog(t, 1.0, 1.4)));
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(px, py, 9 * pk, 0, 6.283); ctx.fill();
  }
  // 2D: plan lines grow out of the point
  const lk = easeOut(prog(t, 1.0, 1.45));
  if (lk > 0 && collapse < 1) {
    ctx.strokeStyle = WHITE; ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) {
      const a = OUTLINE[k], b = OUTLINE[(k + 1) % 4];
      line3(P, [a[0] * lk, 0, a[1] * lk], [b[0] * lk, 0, b[1] * lk]);
    }
    ctx.strokeStyle = "rgba(244,242,243,0.6)"; ctx.lineWidth = 2;
    WALLS.forEach(([a, b]) => line3(P, [a[0], 0, a[1]], [b[0], 0, b[1]], lk));
  }
  // 3D: extrusion
  if (t > 1.6 && collapse < 1) {
    const slabsUp = n => t > 2.5 ? clamp((t - 2.5) / .25 - n) : 0;   // 4D: floors appear one by one
    for (let f = 0; f <= FLOORS; f++) {
      const y = Math.min(f, h);
      if (f > h + .001) break;
      ctx.strokeStyle = f === 0 || f === FLOORS ? WHITE : "rgba(244,242,243,0.55)"; ctx.lineWidth = f === 0 || f === FLOORS ? 3 : 1.6;
      poly3(P, OUTLINE.map(([x, z]) => [x, y, z])); ctx.stroke();
      // 4D slab fill
      if (f < FLOORS) {
        const s = slabsUp(f);
        if (s > 0) {
          ctx.save(); ctx.globalAlpha = .28 * s; ctx.fillStyle = ACC;
          poly3(P, OUTLINE.map(([x, z]) => [x, f + .02, z])); ctx.fill();
          ctx.globalAlpha = .9 * s; ctx.strokeStyle = ACC; ctx.lineWidth = 2.5;
          poly3(P, OUTLINE.map(([x, z]) => [x, f + .02, z])); ctx.stroke();
          ctx.restore();
        }
      }
    }
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2;
    OUTLINE.forEach(([x, z]) => line3(P, [x, 0, z], [x, h, z]));
    ctx.strokeStyle = "rgba(244,242,243,0.35)"; ctx.lineWidth = 1.2;
    for (const x of [-1, 0, 1]) for (const z of [-BZ, BZ]) line3(P, [x, 0, z], [x, h, z]);
    WALLS.forEach(([a, b]) => { line3(P, [a[0], h, a[1]], [b[0], h, b[1]]); });
    // 4D: timeline under the building
    const tk = win(t, 2.5, 4.4, .2, .2);
    if (tk > 0) {
      ctx.save(); ctx.globalAlpha = tk;
      const x0 = 380, x1 = 980, y = 930;
      ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      const pr = clamp((t - 2.5) / 1.0);
      ctx.strokeStyle = ACC; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, pr), y); ctx.stroke();
      ctx.font = `600 20px ${SANS}`; ctx.fillStyle = MUTED; ctx.textAlign = "center";
      ["Q1", "Q2", "Q3", "Q4"].forEach((q, i) => { const x = lerp(x0, x1, (i + .5) / 4); ctx.fillText(q, x, y + 36); ctx.fillRect(x - 1, y - 8, 2, 16); });
      ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(lerp(x0, x1, pr), y, 8, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    // 5D: cost labels per floor + total
    CONFIG.floors.forEach((label, f) => {
      const k = easeBack(prog(t, 3.55 + f * .17, 3.75 + f * .17), 2.4) * (1 - collapse);
      if (k <= 0) return;
      const [sx, sy] = P([BX, f + .5, -BZ]);
      ctx.save(); ctx.translate(sx + 40, sy); ctx.scale(k, k);
      ctx.font = `700 26px ${SANS}`; const w = ctx.measureText(label).width + 28;
      ctx.fillStyle = ACC; ctx.beginPath(); ctx.roundRect(0, -20, w, 40, 8); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, 14, 1);
      ctx.restore();
      ctx.save(); ctx.globalAlpha = k * .6; ctx.strokeStyle = ACC; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 40, sy); ctx.stroke(); ctx.restore();
    });
    const sk = prog(t, 4.2, 4.5);
    if (sk > 0 && collapse < .9) {
      const v = (CONFIG.total * easeOut(sk)).toFixed(1).replace(".", ",");
      ctx.save(); ctx.globalAlpha = 1 - collapse;
      chroma(`Σ ${v} Mio €`, 980, 860, `700 52px ${SANS}`, WHITE, 4 * (1 - sk), "right");
      ctx.restore();
    }
  }
  ctx.restore();
  dimLabel(t);
}

// ===========================================================================
// scene 2: 5D° logo, then the 5 starts counting
// ===========================================================================
CONFIG.flips.forEach(([ft], i) => { cue(ft, "glitch", { p: i }); cue(ft, "tick", { p: i }); });
cue(6.9, "whoosh", { dur: .3, soft: true });

// draws the old logo; num replaces "5"; returns ring position for continuity
function oldLogo(t, num, x, y, s, ab = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.font = `300 230px ${SANS}`; ctx.textBaseline = "alphabetic";
  const txt = num + "D", w = ctx.measureText(txt).width;
  chroma(txt, -w / 2, 0, `300 230px ${SANS}`, WHITE, ab, "left");
  // ring ("°")
  ctx.strokeStyle = WHITE; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(w / 2 + 34, -150, 26, 0, 6.283); ctx.stroke();
  ctx.font = `400 46px ${SANS}`; ctx.letterSpacing = "4px"; ctx.textAlign = "right"; ctx.fillStyle = WHITE;
  ctx.fillText(CONFIG.oldName[1], w / 2 + 6, 60);
  ctx.restore();
}
function sceneLogo(t) {
  backdrop(t);
  const pop = easeBack(prog(t, 4.85, 5.15), 2);
  let num = "5", label = "";
  for (const [ft, n, l] of CONFIG.flips) if (t >= ft) { num = n; label = l || label; }
  const lastFlip = CONFIG.flips.filter(f => t >= f[0]).pop();
  const ab = lastFlip ? 18 * Math.exp(-(t - lastFlip[0]) * 12) : 0;
  const fit = num.length > 1 ? .8 : 1;
  const out = easeIn(prog(t, 7.35, 7.55));
  glow(CX, CY, 520, "rgba(155,28,54,0.6)", .6 * pop + bump(t, 6.0, 1.5) * .6);
  // glitch slices
  ctx.save(); ctx.globalAlpha = 1 - out;
  if (ab > 2) {
    const R = rng(Math.floor(t * 60));
    for (let i = 0; i < 8; i++) {
      const y0 = 300 + R() * 420, hh = 10 + R() * 40, dx = (R() - .5) * ab * 6;
      ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, hh); ctx.clip(); ctx.translate(dx, 0);
      oldLogo(t, num, CX, 600, pop * fit * (1 + out * 2), ab); ctx.restore();
    }
  }
  oldLogo(t, num, CX, 600, pop * fit * (1 + out * 2), ab);
  ctx.restore();
  // captions
  ctx.save(); ctx.globalAlpha = win(t, 5.15, 6.0, .2, .1);
  reveal(CONFIG.since, CX, 820, prog(t, 5.15, 5.5), `italic 600 44px ${SERIF}`, MUTED);
  ctx.restore();
  if (label && t < 6.92) {
    ctx.save(); ctx.globalAlpha = 1 - out;
    chroma(label, CX, 820, `italic 600 48px ${SERIF}`, ACC, ab * .4);
    ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = 1 - out;
  reveal(CONFIG.more, CX, 820, prog(t, 6.95, 7.2), `italic 600 48px ${SERIF}`, WHITE);
  ctx.restore();
}

// ===========================================================================
// scene 3: tesseract — the dimensions beyond
// ===========================================================================
cue(7.5, "impact"); cue(7.5, "braam", { dur: 2.4 });
CONFIG.words.forEach((_, i) => cue(8.0 + i * .5, "hit"));
cue(10.0, "riser", { dur: .9 }); cue(10.0, "roll", { dur: .9 });

const TV = []; for (let i = 0; i < 16; i++) TV.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1, i & 8 ? 1 : -1]);
const TE = []; for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) { const j = i ^ (1 << b); if (j > i) TE.push([i, j, b]); }
function tesseract(t, x, y, size, a = 1, spin = 1, lw = 3) {
  const ax = t * .9 * spin, ay = t * .6 * spin, az = t * .35 * spin;
  const pts = TV.map(([px, py, pz, pw]) => {
    let x1 = px * Math.cos(ax) - pw * Math.sin(ax), w1 = px * Math.sin(ax) + pw * Math.cos(ax);
    let y1 = py * Math.cos(ay) - pz * Math.sin(ay), z1 = py * Math.sin(ay) + pz * Math.cos(ay);
    let z2 = z1 * Math.cos(az) - w1 * Math.sin(az), w2 = z1 * Math.sin(az) + w1 * Math.cos(az);
    const k4 = 2.2 / (3 - w2);
    const X = x1 * k4, Y = y1 * k4, Z = z2 * k4;
    const rx = X * Math.cos(t * .4) - Z * Math.sin(t * .4), rz = X * Math.sin(t * .4) + Z * Math.cos(t * .4);
    const k3 = 4 / (5 + rz);
    return [x + rx * k3 * size, y + Y * k3 * size, w2];
  });
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  TE.forEach(([i, j, b]) => {
    const p = pts[i], q = pts[j];
    ctx.strokeStyle = b === 3 ? `rgba(230,57,80,${.9 * a})` : `rgba(244,242,243,${.75 * a})`;
    ctx.lineWidth = b === 3 ? lw * 1.2 : lw;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
  });
  pts.forEach(p => { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(p[0], p[1], lw * 1.4, 0, 6.283); ctx.fill(); });
  ctx.restore();
}
function tunnel(t, a) {
  // perspective grid floor + ceiling rushing towards the camera
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = "rgba(230,57,80,0.35)"; ctx.lineWidth = 1.5;
  for (const dir of [1, -1]) {
    for (let i = 0; i < 18; i++) {
      const z = ((i / 18) + t * .9) % 1, zz = Math.pow(z, 2.4);
      const y = CY + dir * (40 + zz * 600);
      ctx.globalAlpha = a * z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = a * .7;
    for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 20, CY + dir * 40); ctx.lineTo(CX + i * 160, CY + dir * 700); ctx.stroke(); }
  }
  ctx.restore();
}
function sceneTesseract(t) {
  fill(BG);
  const k = easeOut5(prog(t, 7.5, 7.9)), out = easeIn(prog(t, 10.2, 10.85));
  tunnel(t, (1 - out) * .9);
  glow(CX, CY, 600, "rgba(155,28,54,0.55)", (1 - out) * (.7 + bump(t % .5, 0, .25) * .3));
  tesseract(t, CX, CY, lerp(40, 330, k) * (1 - out * .98), 1 - out * .5, 1 + prog(t, 9.5, 10.8) * 4);
  CONFIG.words.forEach((w, i) => {
    const s = 8.0 + i * .5, a = win(t, s, s + .5, .04, .08);
    if (a <= 0) return;
    const sl = easeOut5(prog(t, s, s + .12));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(CX, CY + 40); ctx.scale(lerp(2.4, 1, sl), lerp(2.4, 1, sl));
    chroma(w, 0, 0, `800 130px ${SANS}`, "#fff", 12 * (1 - prog(t, s, s + .3)));
    ctx.restore();
  });
  const nk = win(t, 10.0, 10.88, .15, .08);
  if (nk > 0) {
    ctx.save(); ctx.globalAlpha = nk;
    reveal(CONFIG.newNameLead[0], CX, 480, prog(t, 10.0, 10.25), `italic 600 70px ${SERIF}`, MUTED);
    reveal(CONFIG.newNameLead[1], CX, 580, prog(t, 10.15, 10.4), `800 84px ${SANS}`, WHITE);
    ctx.restore();
  }
}

// ===========================================================================
// scene 4: REVEAL
// ===========================================================================
cue(10.86, "silence", { dur: .14 }); cue(11.0, "impact"); cue(11.0, "braam", { dur: 3.5, up: true });
[...CONFIG.newName].forEach((_, i) => cue(11.02 + i * .05, "click", { v: 1 }));
cue(11.55, "ding"); cue(12.1, "whoosh", { dur: .35, soft: true }); cue(12.7, "pop", { soft: true }); cue(15.0, "blip");

const LETTERS = (() => { const R = rng(31); return [...CONFIG.newName].map(() => ({ a: R() * 6.283, z: 2 + R() * 3, r: (R() - .5) * 3, d: R() * .1 })); })();
function sceneReveal(t) {
  backdrop(t, prog(t, 11.0, 12.0));
  const shake = 0;
  glow(CX, 520, 700, "rgba(155,28,54,0.75)", .6 + bump(t, 11.0, .6) * .8);
  // god rays
  const ra = (.14 + bump(t, 11.0, .8) * .3) * win(t, 11.0, 16, .2, .5);
  if (ra > 0) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(CX, 520); ctx.rotate(t * .12);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 900); g.addColorStop(0, `rgba(255,190,200,${ra})`); g.addColorStop(1, "rgba(255,190,200,0)");
    ctx.fillStyle = g;
    for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1200, a - .05, a + .05); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  tesseract(t, CX, 520, 420, .14 * prog(t, 12, 13.5), .3, 2);
  // wordmark layout
  const size = 132, spacing = 14;
  ctx.font = `300 ${size}px ${SANS}`; ctx.letterSpacing = spacing + "px";
  const chars = [...CONFIG.newName], ringLast = CONFIG.ringAsLastLetter;
  const body = ringLast ? chars.slice(0, -1) : chars;
  const ringD = size * .72, ringW = ringLast ? ringD + spacing : 0;
  const total = ctx.measureText(body.join("")).width + ringW;
  let x = CX - total / 2;
  const baseY = 560;
  ctx.letterSpacing = "0px";
  body.forEach((ch, i) => {
    ctx.font = `300 ${size}px ${SANS}`;
    const cw = ctx.measureText(ch).width + spacing;
    const L = LETTERS[i], k = easeOut5(prog(t, 11.0 + L.d + i * .04, 11.35 + L.d + i * .04));
    if (k > 0) {
      const fx = x + Math.cos(L.a) * 900 * (1 - k), fy = baseY + Math.sin(L.a) * 700 * (1 - k), sc = lerp(L.z, 1, k);
      ctx.save(); ctx.translate(fx + cw / 2, fy); ctx.rotate(L.r * (1 - k)); ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(k * 2);
      chroma(ch, 0, 0, `300 ${size}px ${SANS}`, WHITE, 14 * (1 - prog(t, 11.0, 11.7)), "center");
      ctx.restore();
    }
    x += cw;
  });
  // the ring: born in the centre at the blackout, flies into the O slot
  const ox = x + ringD / 2, oy = baseY - size * .36;
  const fly = easeInOut(prog(t, 11.05, 11.55));
  const rx = lerp(CX, ringLast ? ox : CX + total / 2 + 40, fly), ry = lerp(520, ringLast ? oy : baseY - size * .9, fly);
  const rr = lerp(46, ringD / 2 - 5, fly) * (1 + bump(t, 11.55, .25) * .25);
  ctx.save();
  ctx.strokeStyle = ACC; ctx.lineWidth = lerp(12, 11, fly); ctx.shadowColor = ACC; ctx.shadowBlur = 30 + bump(t, 11.55, .5) * 50;
  ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 6.283); ctx.stroke();
  ctx.restore();
  // impact shockwaves + sparks
  for (const [h, mr] of [[11.0, 900], [11.55, 380]]) {
    const k = prog(t, h, h + .6);
    if (t >= h && k < 1) {
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `rgba(255,170,185,${1 - k})`; ctx.lineWidth = 24 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(h === 11.0 ? CX : ox, h === 11.0 ? 520 : oy, easeOut(k) * mr, 0, 6.283); ctx.stroke(); ctx.restore();
    }
  }
  const dt = t - 11.0;
  if (dt > 0 && dt < 1.5) {
    const R = rng(77);
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
    for (let i = 0; i < 90; i++) {
      const a = R() * 6.283, v = 300 + R() * 900, d = (1 - Math.exp(-dt * 2.5)) / 2.5;
      const px = CX + Math.cos(a) * v * d, py = 520 + Math.sin(a) * v * d + 200 * dt * dt;
      ctx.globalAlpha = 1 - dt / 1.5; ctx.strokeStyle = i % 3 ? "#ffd2dc" : ACC; ctx.lineWidth = 2 + R() * 3;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(a) * 16, py - Math.sin(a) * 16); ctx.stroke();
    }
    ctx.restore();
  }
  // underline + tagline + formerly
  const ul = easeInOut(prog(t, 11.8, 12.3));
  if (ul > 0) { ctx.fillStyle = ACC; ctx.fillRect(CX - total / 2 * ul, baseY + 50, total * ul, 3); }
  reveal(CONFIG.tagline, CX, baseY + 140, prog(t, 12.1, 12.45), `italic 600 56px ${SERIF}`, WHITE);
  ctx.save(); ctx.globalAlpha = easeOut(prog(t, 12.7, 13.1));
  ctx.font = `400 28px ${SANS}`; ctx.letterSpacing = "6px"; ctx.fillStyle = MUTED; ctx.textAlign = "center";
  ctx.fillText(CONFIG.formerly.toUpperCase(), CX, baseY + 250);
  ctx.letterSpacing = "2px"; ctx.font = `600 26px ${SANS}`; ctx.fillStyle = ACC;
  ctx.globalAlpha = easeOut(prog(t, 13.1, 13.5));
  ctx.fillText(CONFIG.url, CX, baseY + 300);
  ctx.restore();
}

// ===========================================================================
// master
// ===========================================================================
const SHAKES = [[.4, 8], [1.0, 8], [1.5, 12], [2.5, 8], [3.5, 10], [5.0, 14], [6.0, 16], [6.35, 10], [7.24, 14], [7.5, 34],
                [8.0, 16], [8.5, 16], [9.0, 16], [9.5, 18], [11.0, 44], [11.55, 12]];
function shake(t) {
  let a = 0;
  for (const [h, amp] of SHAKES) if (t >= h && t < h + .7) a += amp * Math.exp(-(t - h) * 8);
  a += prog(t, 10.2, 10.85) * 7;
  return [a * Math.sin(t * 91.3) * Math.cos(t * 17.1), a * Math.cos(t * 83.7) * Math.sin(t * 23.9), a * .0016 * Math.sin(t * 61)];
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over"; ctx.letterSpacing = "0px";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const [sx, sy, sr] = shake(t);
  ctx.save(); ctx.translate(CX + sx, CY + sy); ctx.rotate(sr); ctx.translate(-CX, -CY);
  if (t < 4.95) sceneDims(t);
  else if (t < 7.5) sceneLogo(t);
  else if (t < 10.9) sceneTesseract(t);
  else if (t < 11.0) { fill("#000"); }
  else sceneReveal(t);
  // the ring alone in the blackout
  if (t >= 10.55 && t < 11.05) {
    const k = easeOut(prog(t, 10.55, 10.8));
    ctx.save(); ctx.strokeStyle = ACC; ctx.lineWidth = 12; ctx.shadowColor = ACC; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(CX, 520, 46 * k, 0, 6.283 * k); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  vignette(t > 11 ? .45 : .6);
  for (const [h, a] of [[5.0, .5], [7.5, .9], [11.0, 1]]) {
    const f = (1 - prog(t, h, h + .3)) * a;
    if (t >= h && f > 0) { ctx.fillStyle = `rgba(255,236,240,${f})`; ctx.fillRect(0, 0, W, H); }
  }
  const fade = Math.max(1 - prog(t, 0, .3), prog(t, 15.7, 16));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

const acc = document.getElementById("acc"), actx = acc.getContext("2d");
function renderFrame(t, fps = 60, samples = 6, shutter = .55) {
  if (samples <= 1) { render(t); return cv.toDataURL("image/png").split(",")[1]; }
  actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  for (let i = 0; i < samples; i++) {
    const st = Math.min(DURATION - 1e-4, Math.max(0, t + (i / (samples - 1) - .5) * shutter / fps));
    render(st); actx.globalAlpha = 1 / (i + 1); actx.drawImage(cv, 0, 0);
  }
  return acc.toDataURL("image/png").split(",")[1];
}
window.render = render; window.renderFrame = renderFrame; window.DURATION = DURATION; window.SFX = SFX; window.MUSIC = "reveal";
window.ready = Promise.all([
  document.fonts.load(`300 40px ${SANS}`), document.fonts.load(`800 40px ${SANS}`), document.fonts.load(`200 40px ${SANS}`),
  document.fonts.load(`italic 600 40px ${SERIF}`),
]).then(() => document.fonts.ready);
if (!location.search.includes("render")) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
