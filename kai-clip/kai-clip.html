<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>KAI Motion Clip</title>
<style>
  @font-face { font-family: "Lora"; src: url(fonts/Lora.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Lora"; src: url(fonts/Lora-Italic.woff2) format("woff2"); font-weight: 400 700; font-style: italic; }
  @font-face { font-family: "Noto Sans"; src: url(fonts/NotoSans.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #2a1a20; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
// ---------------------------------------------------------------------------
// All on-screen copy lives here – edit and re-render (node render.mjs).
// The chat numbers are illustrative sample data.
// ---------------------------------------------------------------------------
const CONFIG = {
  name: "KAI",
  headline: ["Frag deine", "Baudaten."],
  headlineAccent: "In Klartext.",
  tabs: ["Bereit", "Datenbank-Chat", "Doku", "Agent"],
  question: "Welche Nachträge sind im Projekt Schulzentrum Nord noch offen?",
  answerLead: "3 Nachträge sind offen:",
  rows: [["NT-07", "Mehrmengen Erdarbeiten", "48.200 €"], ["NT-09", "Brandschutztüren", "21.750 €"], ["NT-12", "Bauzeitverlängerung", "36.900 €"]],
  sum: ["Summe", "106.850 €"],
  sampleLabel: "Beispieldaten",
  modesTitle: ["Ein Assistent,", "drei Arbeitsweisen"],
  modes: [["Datenbank", "Kosten, Mengen,", "Termine, LVs"], ["Dokumentation", "Antworten aus", "der RIB 4.0-Doku"], ["Agent", "Übernimmt definierte", "Tätigkeiten"]],
  features: ["RIB 4.0 & RIB iTWO", "Read-only als Standard", "Browser oder Plugin"],
  ctaLead: "Paket auswählen oder Demo buchen",
  url: "xdhub.de/kai",
};

const DURATION = 15;
const W = 1080, H = 1080, CX = W / 2, CY = H / 2;
const RED = "#9b1c36", RED_D = "#7d1229", INK = "#16121a", GREY = "#6c6469", PINK = "#f6e4ea", LINE = "#e9d3da", GREEN = "#2fae6b";
const SERIF = "Lora", SANS = "'Noto Sans'";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .35, fo = .35) => Math.min(easeOut(prog(t, a, a + fi)), 1 - easeIn(prog(t, b - fo, b)));

function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(text, maxW) {
  const words = text.split(" "), lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// text that slides up out of a mask
function reveal(text, x, y, k, font, color, align = "left") {
  if (k <= 0) return;
  ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(text), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const x0 = align === "center" ? x - m.width / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 20, y - asc - 14, m.width + 40, asc + desc + 28); ctx.clip();
  ctx.globalAlpha *= clamp(k * 1.5);
  ctx.fillStyle = color; ctx.fillText(text, x, y + (1 - easeOut(k)) * (asc + desc + 20));
  ctx.restore();
}

// ---------- background ----------
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#f8e7ed"); g.addColorStop(.6, "#fcf6f8"); g.addColorStop(1, "#f9eef2");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blobs = [
    [880 + Math.sin(t * .5) * 80, 160 + Math.cos(t * .4) * 60, 420, "rgba(155,28,54,0.10)"],
    [140 + Math.cos(t * .45) * 70, 920 + Math.sin(t * .35) * 50, 460, "rgba(214,120,150,0.14)"],
  ];
  for (const [x, y, r, c] of blobs) {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c); rg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  // dot grid, gently drifting
  ctx.fillStyle = "rgba(155,28,54,0.10)";
  const off = (t * 10) % 40;
  for (let y = -40; y < H + 40; y += 40) for (let x = -40; x < W + 40; x += 40) ctx.fillRect(x + off, y + off * .5, 2, 2);
}

// brand mark: "KAI" wordmark with a red dot
function brand(x, y, size, alpha = 1, align = "left") {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `700 ${size}px ${SERIF}`; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  const w = ctx.measureText(CONFIG.name).width;
  ctx.fillStyle = INK; ctx.fillText(CONFIG.name, x, y);
  const end = align === "center" ? x + w / 2 : x + w;
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(end + size * .16, y - size * .07, size * .09, 0, 6.283); ctx.fill();
  ctx.restore();
}


// KAI mascot, drawn in vectors. (x, y) = body centre, s = scale (body is 184×145 at s = 1).
// o.look [-1..1, -1..1] moves the pupils, o.wave 0..1 raises the right arm,
// o.spin rotates the status ring, o.hop lifts the body, o.squash flattens on landing.
function mascot(t, x, y, s, o = {}) {
  const { look = [0, 0], wave = 0, spin = 0, hop = 0, squash = 0, alpha = 1 } = o;
  if (s <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y - hop); ctx.scale(s, s);
  // soft floor shadow
  ctx.save(); ctx.translate(0, 125 + hop / s); ctx.scale(1 - hop / s / 400, 1);
  ctx.fillStyle = "rgba(125,18,41,0.14)"; ctx.beginPath(); ctx.ellipse(0, 0, 80, 10, 0, 0, 6.283); ctx.fill();
  ctx.restore();
  ctx.fillStyle = RED;
  // legs
  const legH = 50 - squash * 14;
  rrect(-57, 60, 32, legH + 8, 16); ctx.fill();
  rrect(25, 60, 32, legH + 8, 16); ctx.fill();
  ctx.save(); ctx.translate(0, squash * 14); ctx.scale(1 + squash * .08, 1 - squash * .1);
  // left arm (static) and right arm (waves)
  ctx.beginPath(); ctx.arc(-105, 24, 18, 0, 6.283); ctx.fill();
  const wa = wave * (-1.25 + Math.sin(t * 14) * .35);
  ctx.save(); ctx.translate(80, 10); ctx.rotate(wa);
  ctx.beginPath(); ctx.arc(27, 14, 18, 0, 6.283); ctx.fill();
  ctx.restore();
  // body
  rrect(-92, -72, 184, 145, 32); ctx.fill();
  // eyes with blink + gaze
  const bl = (t + x * .001) % 3.4, blink = bl > 3.25 ? .12 : 1;
  ctx.fillStyle = "#fff";
  for (const ex of [-38, 38]) {
    ctx.beginPath(); ctx.ellipse(ex + look[0] * 9, -10 + look[1] * 7, 22, 22 * blink, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  // status ring with a gap, top right
  ctx.save(); ctx.translate(121, -80); ctx.rotate(spin - 2.4);
  ctx.strokeStyle = RED; ctx.lineWidth = 6.5;
  ctx.beginPath(); ctx.arc(0, 0, 16, .45, 6.283 - .1); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ---------- scenes ----------
function sceneHeadline(t) {
  const a = 1 - easeIn(prog(t, 2.95, 3.35));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const lift = easeIn(prog(t, 2.95, 3.35)) * -60;
  ctx.translate(0, lift);
  brand(100, 180, 44, easeOut(prog(t, .1, .5)));
  const x = 100, size = 128;
  reveal(CONFIG.headline[0], x, 430, prog(t, .25, .85), `700 ${size}px ${SERIF}`, INK);
  reveal(CONFIG.headline[1], x, 570, prog(t, .55, 1.15), `700 ${size}px ${SERIF}`, INK);
  reveal(CONFIG.headlineAccent, x, 715, prog(t, 1.15, 1.75), `italic 700 ${size}px ${SERIF}`, RED);
  // hand-drawn underline under the accent
  const u = easeInOut(prog(t, 1.7, 2.3));
  if (u > 0) {
    ctx.font = `italic 700 ${size}px ${SERIF}`;
    const w = ctx.measureText(CONFIG.headlineAccent).width;
    ctx.strokeStyle = RED; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.globalAlpha = a * .85;
    ctx.beginPath();
    for (let i = 0; i <= 40 * u; i++) {
      const px = x + 6 + (w - 12) * i / 40, py = 750 + Math.sin(i / 40 * Math.PI) * 10 - i * .25;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
  // mascot drops in, lands, waves and looks at the headline
  const drop = prog(t, .8, 1.35), land = prog(t, 1.35, 1.65);
  ctx.globalAlpha = a;
  if (drop > 0) {
    const hop = (1 - easeIn(drop)) * 700 + Math.max(0, Math.sin(prog(t, 2.6, 3.1) * Math.PI)) * 30;
    mascot(t, 872, 492, 1.0, {
      hop, squash: Math.sin(land * Math.PI) * .9, wave: win(t, 1.7, 2.9, .2, .25),
      look: [lerp(0, -1, easeInOut(prog(t, 1.8, 2.2))), lerp(0, .5, easeInOut(prog(t, 1.8, 2.2)))],
      spin: t * 1.5,
    });
  }
  // sub line
  ctx.globalAlpha = a * easeOut(prog(t, 2.0, 2.5));
  ctx.font = `400 34px ${SANS}`; ctx.fillStyle = GREY; ctx.textAlign = "left";
  ctx.fillText("Eine Oberfläche, eine Frage, eine unmittelbare Antwort.", x, 850);
  ctx.restore();
}

function sceneChat(t) {
  const a = win(t, 3.2, 9.75, .45, .4);
  if (a <= 0) return;
  const rise = easeOut(prog(t, 3.2, 3.8));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - rise) * 140);
  const x = 80, y = 110, w = 920, h = 860;
  rrect(x, y, w, h, 36);
  ctx.fillStyle = "#ffffff"; ctx.shadowColor = "rgba(125,18,41,0.18)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 20; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();

  // header: brand + sample label
  const think = t > 4.55 && t < 5.6;
  mascot(t, x + 78, y + 64, .3, { look: t < 4.6 ? [.8, .6] : [.6, 1], spin: think ? t * 9 : 0, hop: think ? Math.abs(Math.sin(t * 9)) * 4 : 0 });
  brand(x + 132, y + 80, 40);
  ctx.font = `600 20px ${SANS}`; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  const sl = ctx.measureText(CONFIG.sampleLabel).width + 32;
  rrect(x + w - 44 - sl, y + 42, sl, 38, 19); ctx.fillStyle = "#f4f1f2"; ctx.fill();
  ctx.fillStyle = GREY; ctx.fillText(CONFIG.sampleLabel, x + w - 60, y + 62);

  // mode tabs (like the site)
  const ty = y + 118; ctx.textAlign = "left"; ctx.font = `600 24px ${SANS}`;
  let tx = x + 44;
  CONFIG.tabs.forEach((label, i) => {
    const tw = ctx.measureText(label).width + (i === 0 ? 50 : 36);
    if (i === 0) {
      ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(tx + 16, ty + 26, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = GREEN; ctx.fillText(label, tx + 32, ty + 27);
    } else {
      const active = i === 1;
      if (active) { rrect(tx, ty, tw, 52, 26); ctx.fillStyle = PINK; ctx.fill(); }
      ctx.fillStyle = active ? RED : "#a59ca1"; ctx.fillText(label, tx + 18, ty + 27);
    }
    tx += tw + 12;
  });
  ctx.fillStyle = LINE; ctx.fillRect(x + 44, ty + 76, w - 88, 2);

  // question bubble
  const qb = easeBack(prog(t, 3.9, 4.35));
  ctx.font = `400 31px ${SANS}`; ctx.textBaseline = "top";
  const ql = wrap(CONFIG.question, 560), lh = 44;
  const qw = Math.max(...ql.map(l => ctx.measureText(l).width)) + 60, qh = ql.length * lh + 42;
  const qx = x + w - 44 - qw, qy = y + 215;
  if (qb > 0) {
    ctx.save(); ctx.globalAlpha = a * clamp(qb);
    ctx.translate(qx + qw, qy + qh); ctx.scale(qb, qb); ctx.translate(-(qx + qw), -(qy + qh));
    rrect(qx, qy, qw, qh, 28); ctx.fillStyle = RED; ctx.fill();
    ctx.fillStyle = "#fff"; ql.forEach((l, i) => ctx.fillText(l, qx + 30, qy + 21 + i * lh));
    ctx.restore();
  }

  // answer
  const ax = x + 44, ay = qy + qh + 40, aw = w - 88;
  const ab = easeOut(prog(t, 4.6, 4.9));
  if (ab > 0) {
    ctx.save(); ctx.globalAlpha = a * ab;
    const thinking = t < 5.5;
    const ah = thinking ? 84 : lerp(84, 370, easeOut(prog(t, 5.5, 5.9)));
    rrect(ax, ay, thinking ? 140 : aw, ah, 28); ctx.fillStyle = "#f7f2f4"; ctx.fill();
    if (thinking) {
      for (let i = 0; i < 3; i++) {
        const b = Math.max(0, Math.sin(t * 9 - i * .9));
        ctx.fillStyle = RED; ctx.globalAlpha = a * ab * (.35 + .65 * b);
        ctx.beginPath(); ctx.arc(ax + 42 + i * 28, ay + 42 - b * 7, 8, 0, 6.283); ctx.fill();
      }
    } else {
      ctx.save(); rrect(ax, ay, aw, ah, 28); ctx.clip();
      ctx.textBaseline = "alphabetic";
      reveal(CONFIG.answerLead, ax + 34, ay + 64, prog(t, 5.7, 6.1), `600 32px ${SANS}`, INK);
      CONFIG.rows.forEach((r, i) => {
        const k = prog(t, 6.15 + i * .35, 6.55 + i * .35), ry = ay + 128 + i * 64;
        if (k <= 0) return;
        ctx.save(); ctx.globalAlpha *= easeOut(k); ctx.translate((1 - easeOut(k)) * 40, 0);
        ctx.font = `600 28px ${SANS}`; ctx.fillStyle = RED; ctx.textAlign = "left"; ctx.fillText(r[0], ax + 34, ry);
        ctx.font = `400 28px ${SANS}`; ctx.fillStyle = INK; ctx.fillText(r[1], ax + 150, ry);
        ctx.font = `600 28px ${SANS}`; ctx.textAlign = "right"; ctx.fillText(r[2], ax + aw - 34, ry);
        ctx.fillStyle = LINE; ctx.fillRect(ax + 34, ry + 22, aw - 68, 1.5);
        ctx.restore();
      });
      const sk = easeOut(prog(t, 7.3, 7.7));
      if (sk > 0) {
        const sy = ay + 128 + 3 * 64 + 10;
        ctx.globalAlpha *= sk;
        ctx.fillStyle = INK; ctx.fillRect(ax + 34, sy - 38, (aw - 68) * sk, 2.5);
        ctx.font = `700 32px ${SERIF}`; ctx.textAlign = "left"; ctx.fillText(CONFIG.sum[0], ax + 34, sy + 6);
        ctx.textAlign = "right"; ctx.fillStyle = RED;
        // count-up on the total
        const total = 106850 * easeOut(prog(t, 7.3, 8.1));
        const txt = CONFIG.sum[1] === "106.850 €" ? Math.round(total).toLocaleString("de-DE") + " €" : CONFIG.sum[1];
        ctx.fillText(txt, ax + aw - 34, sy + 6);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // read-only chip
  const ck = easeBack(prog(t, 8.2, 8.6));
  if (ck > 0) {
    ctx.font = `600 24px ${SANS}`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    const label = "Read-only  ·  unmittelbare Antwort", cw = ctx.measureText(label).width + 76;
    const cx0 = ax, cy0 = y + h - 82;
    ctx.save(); ctx.globalAlpha = a * clamp(ck);
    ctx.translate(cx0, cy0 + 27); ctx.scale(ck, ck); ctx.translate(-cx0, -(cy0 + 27));
    rrect(cx0, cy0, cw, 54, 27); ctx.fillStyle = "rgba(47,174,107,0.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(47,174,107,0.45)"; ctx.lineWidth = 1.5; ctx.stroke();
    // lock icon
    ctx.strokeStyle = GREEN; ctx.lineWidth = 2.5; ctx.fillStyle = GREEN;
    rrect(cx0 + 22, cy0 + 25, 20, 16, 3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx0 + 32, cy0 + 25, 6, Math.PI, 0); ctx.stroke();
    ctx.fillText(label, cx0 + 54, cy0 + 28);
    ctx.restore();
  }
  ctx.restore();
}

function icon(kind, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (kind === 0) { // database
    for (const yy of [-16, 0, 16]) { ctx.beginPath(); ctx.ellipse(0, yy, s, s * .38, 0, 0, Math.PI); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(0, -16, s, s * .38, 0, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s, -16); ctx.lineTo(-s, 16); ctx.moveTo(s, -16); ctx.lineTo(s, 16); ctx.stroke();
  } else if (kind === 1) { // document
    ctx.beginPath(); ctx.moveTo(-s * .8, -s * 1.1); ctx.lineTo(s * .35, -s * 1.1); ctx.lineTo(s * .8, -s * .65); ctx.lineTo(s * .8, s * 1.1); ctx.lineTo(-s * .8, s * 1.1); ctx.closePath(); ctx.stroke();
    for (const yy of [-.3, .15, .6]) { ctx.beginPath(); ctx.moveTo(-s * .45, s * yy); ctx.lineTo(s * .45, s * yy); ctx.stroke(); }
  } else { // agent: spark / gear-ish
    ctx.beginPath(); ctx.arc(0, 0, s * .45, 0, 6.283); ctx.stroke();
    for (let i = 0; i < 8; i++) { const an = i / 8 * 6.283; ctx.beginPath(); ctx.moveTo(Math.cos(an) * s * .72, Math.sin(an) * s * .72); ctx.lineTo(Math.cos(an) * s, Math.sin(an) * s); ctx.stroke(); }
  }
  ctx.restore();
}

function sceneModes(t) {
  const a = win(t, 9.65, 12.45, .35, .35);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  reveal(CONFIG.modesTitle[0], CX, 320, prog(t, 9.7, 10.2), `700 84px ${SERIF}`, INK, "center");
  reveal(CONFIG.modesTitle[1], CX, 420, prog(t, 9.95, 10.45), `italic 700 84px ${SERIF}`, RED, "center");
  const cw = 300, gap = 20, x0 = CX - (cw * 3 + gap * 2) / 2, cy = 510;
  CONFIG.modes.forEach((m, i) => {
    const k = easeBack(prog(t, 10.4 + i * .2, 10.9 + i * .2));
    if (k <= 0) return;
    const cx = x0 + i * (cw + gap);
    ctx.save(); ctx.globalAlpha = a * clamp(k); ctx.translate(0, (1 - k) * 80);
    rrect(cx, cy, cw, 340, 28);
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(125,18,41,0.14)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + cw / 2, cy + 95, 52, 0, 6.283); ctx.fillStyle = PINK; ctx.fill();
    icon(i, cx + cw / 2, cy + 95, 26, RED);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.font = `700 32px ${SERIF}`; ctx.fillStyle = INK; ctx.fillText(m[0], cx + cw / 2, cy + 210);
    ctx.font = `400 24px ${SANS}`; ctx.fillStyle = GREY;
    ctx.fillText(m[1], cx + cw / 2, cy + 260); ctx.fillText(m[2], cx + cw / 2, cy + 294);
    ctx.restore();
  });
  ctx.restore();
}

function sceneCTA(t) {
  const a = easeOut(prog(t, 12.4, 12.8));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const mk = easeBack(prog(t, 12.4, 12.9));
  mascot(t, CX - 12, 205, .95 * mk, {
    hop: Math.max(0, Math.sin(prog(t, 13.9, 14.35) * Math.PI)) * 28, wave: win(t, 13.0, 14.6, .2, .3),
    look: [0, .4 + .4 * easeInOut(prog(t, 13.4, 13.8))], spin: t * 2.2,
  });
  const bk = easeBack(prog(t, 12.55, 13.05));
  ctx.save(); ctx.translate(CX, 440); ctx.scale(lerp(.8, 1, bk), lerp(.8, 1, bk));
  brand(0, 0, 120, clamp(bk), "center");
  ctx.restore();
  reveal(CONFIG.headline.join(" "), CX, 515, prog(t, 12.7, 13.15), `700 48px ${SERIF}`, INK, "center");
  reveal(CONFIG.headlineAccent, CX, 575, prog(t, 12.85, 13.3), `italic 700 48px ${SERIF}`, RED, "center");
  // feature chips
  ctx.font = `600 24px ${SANS}`;
  const widths = CONFIG.features.map(f => ctx.measureText(f).width + 64);
  const total = widths.reduce((s, v) => s + v, 0) + 16 * (widths.length - 1);
  let fx = CX - total / 2;
  CONFIG.features.forEach((f, i) => {
    const k = easeBack(prog(t, 13.0 + i * .12, 13.4 + i * .12));
    if (k > 0) {
      ctx.save(); ctx.globalAlpha = a * clamp(k); ctx.translate(0, (1 - k) * 20);
      rrect(fx, 618, widths[i], 54, 27); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(fx + 26, 645, 5, 0, 6.283); ctx.fill();
      ctx.fillStyle = INK; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(f, fx + 42, 646);
      ctx.restore();
    }
    fx += widths[i] + 16;
  });
  // url button
  const pk = easeBack(prog(t, 13.35, 13.85));
  if (pk > 0) {
    ctx.font = `600 54px ${SANS}`;
    const label = CONFIG.url, uw = ctx.measureText(label).width + 190, ph = 110, px = CX - uw / 2, py = 718;
    ctx.save(); ctx.globalAlpha = a * clamp(pk);
    ctx.translate(CX, py + ph / 2); ctx.scale(pk, pk); ctx.translate(-CX, -(py + ph / 2));
    rrect(px, py, uw, ph, 22);
    ctx.fillStyle = RED; ctx.shadowColor = "rgba(155,28,54,0.40)"; ctx.shadowBlur = 40 + Math.sin(t * 4) * 10; ctx.shadowOffsetY = 14; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save(); ctx.clip();
    const sx = px - 200 + (((t - 13.8) % 1.7 + 1.7) % 1.7) / 1.7 * (uw + 400);
    const sg = ctx.createLinearGradient(sx - 90, 0, sx + 90, 0);
    sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, "rgba(255,255,255,0.22)"); sg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sg; ctx.fillRect(px, py, uw, ph);
    ctx.restore();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(label, px + 60, py + ph / 2 + 2);
    // arrow, nudging right
    const ax = px + uw - 90 + Math.sin(t * 5) * 6, ay = py + ph / 2;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(ax - 18, ay); ctx.lineTo(ax + 18, ay); ctx.moveTo(ax + 4, ay - 14); ctx.lineTo(ax + 18, ay); ctx.lineTo(ax + 4, ay + 14); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = a * easeOut(prog(t, 13.7, 14.1));
  ctx.font = `400 30px ${SANS}`; ctx.fillStyle = GREY; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(CONFIG.ctaLead, CX, 885);
  ctx.restore();
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.letterSpacing = "0px";
  background(t);
  sceneHeadline(t);
  sceneChat(t);
  sceneModes(t);
  sceneCTA(t);
  const edge = Math.max(1 - prog(t, 0, .3), prog(t, 14.8, 15));
  if (edge > 0) { ctx.globalAlpha = edge; ctx.fillStyle = "#fcf6f8"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
window.render = render;
window.DURATION = DURATION;

window.ready = Promise.all([
  document.fonts.load(`700 40px ${SERIF}`), document.fonts.load(`italic 700 40px ${SERIF}`),
  document.fonts.load(`400 40px ${SANS}`), document.fonts.load(`600 40px ${SANS}`),
]).then(() => document.fonts.ready);
if (!location.search.includes("render")) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
