<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Rebrand Reveal Epic</title>
<style>
  @font-face { font-family: "Lora"; src: url(fonts/Lora.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Lora"; src: url(fonts/Lora-Italic.woff2) format("woff2"); font-weight: 400 700; font-style: italic; }
  @font-face { font-family: "Noto Sans"; src: url(fonts/NotoSans.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
  #acc { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<canvas id="acc" width="1080" height="1080"></canvas>
<script>
// ===========================================================================
// 5D INSTITUT → NEUER NAME — Epic Cut, 32 s, 120-BPM-Raster, ruhigeres Tempo.
//  0–3   1D   Ein Lichtpunkt.            3–6   2D   Grundriss zeichnet sich.
//  6–8   3D   Gebäude wächst.            8–10  4D   Eine ganze Stadt wächst in Wellen.
// 10–12.5 5D  Kosten leuchten auf.      12.5–15.5   Stadt → Partikel → 5D°-Logo.
// 15.5–19     5 zählt bis ∞, Logo zerspringt.   19–23.5  Flug durch Tesserakte.
// 23.5–25.5   „Zeit für einen neuen Namen." → Stille.   25.5– Reveal aus Partikeln.
// Namen ändern: CONFIG.newName.
// ===========================================================================
const CONFIG = {
  newName: "DIMENSIO",
  ringAsLastLetter: true,
  tagline: "Bauen in allen Dimensionen.",
  formerly: "vormals 5D Institut",
  url: "5d-institut.de",
  opener: "Alles beginnt mit einem Punkt.",
  dims: [["1D", "Punkt."], ["2D", "Fläche."], ["3D", "Raum."], ["4D", "Zeit."], ["5D", "Kosten."]],
  dimStarts: [.8, 3.0, 6.0, 8.0, 10.0],
  since: "Fünf Dimensionen. Seit 2016.",
  flips: [[15.5, "6", "Nachhaltigkeit"], [16.3, "7", "Betrieb"], [17.0, "8", ""], [17.35, "9", ""], [17.6, "12", ""],
          [17.8, "27", ""], [17.95, "99", ""], [18.1, "∞", ""]],
  more: "Bauen hat mehr Dimensionen.",
  words: ["Daten.", "Prozesse.", "KI.", "Menschen."],
  newNameLead: ["Zeit für einen", "neuen Namen."],
  costs: ["4,2 Mio €", "2,8 Mio €", "3,6 Mio €", "1,9 Mio €", "5,1 Mio €"],
  total: 48.6,
};
const DURATION = 32, REV = 25.5;
const W = 1080, H = 1080, CX = W / 2, CY = H / 2;
const BG = "#09080c", WHITE = "#f4f2f3", ACC = "#e63950", RED = "#9b1c36", MUTED = "rgba(244,242,243,0.6)";
const SANS = "'Noto Sans'", SERIF = "Lora";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOut5 = x => 1 - Math.pow(1 - x, 5);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeSine = x => .5 - .5 * Math.cos(Math.PI * x);
const easeBack = (x, c1 = 1.5) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .4, fo = .4) => Math.min(easeOut(prog(t, a, a + fi)), 1 - easeIn(prog(t, b - fo, b)));
const bump = (t, a, d) => Math.max(0, Math.sin(prog(t, a, a + d) * Math.PI));
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function fill(c) { ctx.fillStyle = c; ctx.fillRect(-W, -H, W * 3, H * 3); }
function chroma(text, x, y, font, color, ab = 0, align = "center", spacing = 0) {
  ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.letterSpacing = spacing + "px";
  if (ab > .3) {
    ctx.globalAlpha *= .7;
    ctx.fillStyle = "#ff1e5a"; ctx.fillText(text, x - ab, y);
    ctx.fillStyle = "#1ee6ff"; ctx.fillText(text, x + ab, y + ab * .25);
    ctx.globalAlpha /= .7;
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}
function reveal(text, x, y, k, font, color, align = "center", spacing = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.font = font; ctx.letterSpacing = spacing + "px"; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(text), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const x0 = align === "center" ? x - m.width / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 40, y - asc - 16, m.width + 80, asc + desc + 32); ctx.clip();
  ctx.globalAlpha *= clamp(k * 1.4); ctx.fillStyle = color;
  ctx.fillText(text, x, y + (1 - easeOut5(k)) * (asc + desc + 22));
  ctx.restore();
}
function glow(x, y, r, color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
}
// anamorphic lens flare: hot core + long horizontal streak + ghosts
function flare(x, y, a, size = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  glow(x, y, 180 * size, "rgba(255,200,210,1)", a * .9);
  const g = ctx.createLinearGradient(x - 700 * size, 0, x + 700 * size, 0);
  g.addColorStop(0, "rgba(255,80,110,0)"); g.addColorStop(.5, `rgba(255,225,232,${a})`); g.addColorStop(1, "rgba(255,80,110,0)");
  ctx.fillStyle = g; ctx.fillRect(x - 700 * size, y - 2.5 * size, 1400 * size, 5 * size);
  ctx.globalAlpha = a * .5; ctx.fillRect(x - 700 * size, y - 9 * size, 1400 * size, 18 * size);
  for (const [k, r, c] of [[.5, 34, "255,120,150"], [.9, 16, "140,200,255"], [1.4, 60, "230,57,80"]]) {
    ctx.globalAlpha = a * .3; ctx.fillStyle = `rgb(${c})`;
    ctx.beginPath(); ctx.arc(lerp(x, CX, k * 2), lerp(y, CY, k * 2), r * size, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
function backdrop(t, a = 1) {
  fill(BG);
  ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = 1;
  const off = (t * 10) % 60;
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  for (let x = -60 + off; x < W + 60; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -60 + off * .5; y < H + 60; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function vignette(d = .65) {
  const g = ctx.createRadialGradient(CX, CY, 340, CX, CY, 800);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${d})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- stars (hyperspace) ----------
const SPEED = t => .03 + 1.1 * prog(t, 19.0, 19.6) * (1 - prog(t, 23.3, 24.6)) + .8 * bump(t, 19.0, .8);
const DIST = (() => { const a = [0]; for (let i = 1; i <= DURATION * 240 + 10; i++) a.push(a[i - 1] + SPEED(i / 240) / 240); return a; })();
const dist = t => DIST[Math.max(0, Math.min(DIST.length - 1, Math.round(t * 240)))];
const STARS = (() => { const R = rng(5); return Array.from({ length: 420 }, () => ({ x: (R() - .5) * 2.2, y: (R() - .5) * 2.2, z: R() })); })();
function starfield(t, alpha = 1) {
  const d = dist(t), sp = SPEED(t);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (const s of STARS) {
    const z = ((s.z - d) % 1 + 1) % 1 + .02, z2 = Math.min(1.1, z + sp * .06);
    const x1 = CX + s.x / z * 330, y1 = CY + s.y / z * 330, x2 = CX + s.x / z2 * 330, y2 = CY + s.y / z2 * 330;
    if (x1 < -50 || x1 > W + 50 || y1 < -50 || y1 > H + 50) continue;
    ctx.strokeStyle = `rgba(240,235,245,${clamp(1.15 - z) * alpha})`; ctx.lineWidth = .6 + (1 - z) * 2.4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 + .01, y2); ctx.stroke();
  }
  ctx.restore();
}

// ---------- 3D camera ----------
function makeCam(yaw, pitch, dist_, fov, cx = CX, cy = CY, ty = 0) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  return p => {
    const x = p[0], y = p[1] - ty, z = p[2];
    const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const s = fov / (z2 + dist_);
    return [cx + x1 * s, cy - y2 * s, z2];
  };
}
// camera choreography for the dimension scenes
function camAt(t) {
  const tilt = easeInOut(prog(t, 6.0, 7.6));
  const crane = easeInOut(prog(t, 7.8, 10.2));
  const orbit = easeSine(prog(t, 3.0, 12.6));
  const yaw = lerp(0, .35, prog(t, 3, 6)) * (1 - tilt) + tilt * lerp(-.45, -1.55, orbit);
  const pitch = lerp(Math.PI / 2 - .0001, .5, tilt) + crane * .32;
  const dist_ = 14 + crane * 17 + prog(t, 10, 12.6) * 3;
  const fov = lerp(lerp(900, 1500, easeOut(prog(t, 0, 3))), 1500, prog(t, 3, 6));
  return makeCam(yaw, pitch, dist_, fov, CX, lerp(CY, 640, tilt) - crane * 30, crane * 1.0);
}
function line3(P, a, b, k = 1) { const p = P(a), q = P(b); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(lerp(p[0], q[0], k), lerp(p[1], q[1], k)); ctx.stroke(); }
function polyPts(pts) { ctx.beginPath(); pts.forEach((s, i) => i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1])); ctx.closePath(); }
const area = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };

// box: x,z centre, half sizes w,d, height h
function drawBox(P, b, h, opts = {}) {
  if (h <= .001) return;
  const { edge = "rgba(244,242,243,0.55)", top = "#1d1b24", lw = 1.4, topGlow = 0 } = opts;
  const x0 = b.x - b.w, x1 = b.x + b.w, z0 = b.z - b.d, z1 = b.z + b.d;
  const V = [[x0, 0, z0], [x1, 0, z0], [x1, 0, z1], [x0, 0, z1], [x0, h, z0], [x1, h, z0], [x1, h, z1], [x0, h, z1]].map(P);
  const faces = [[[4, 5, 6, 7], top], [[0, 1, 5, 4], "#131118"], [[1, 2, 6, 5], "#0f0d13"], [[2, 3, 7, 6], "#131118"], [[3, 0, 4, 7], "#0f0d13"]];
  for (const [idx, col] of faces) {
    const pts = idx.map(i => V[i]);
    if (area(pts) >= 0) continue;   // back face
    polyPts(pts); ctx.fillStyle = col; ctx.fill();
    if (idx[0] === 4 && topGlow > 0) { ctx.save(); ctx.globalAlpha = topGlow; ctx.fillStyle = ACC; ctx.fill(); ctx.restore(); }
    ctx.strokeStyle = edge; ctx.lineWidth = lw; ctx.stroke();
  }
  return V;
}

// hero building (from the floor plan) + city
const HERO = { x: 0, z: 0, w: 2, d: 1.5 };
const WALLS = [[[0, -1.5], [0, 1.5]], [[0, 0], [2, 0]], [[-1, -1.5], [-1, 0]], [[-2, .6], [0, .6]]];
const CITY = (() => {
  const R = rng(42), b = [];
  for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
    if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue;
    const dd = Math.hypot(i, j);
    b.push({ x: i * 1.75 + (R() - .5) * .3, z: j * 1.75 + (R() - .5) * .3, w: .5 + R() * .25, d: .5 + R() * .25,
             h: .7 + R() * 3.4 * (1 - dd / 7.5) + R() * .5, dist: dd, cost: -1 });
  }
  // five tall ones get cost labels in 5D
  [...b].sort((p, q) => q.h - p.h).slice(0, 5).forEach((x, i) => x.cost = i);
  return b;
})();
const heroH = t => 4 * easeOut(prog(t, 6.2, 7.6));
const cityH = (b, t) => b.h * easeBack(prog(t, 8.0 + b.dist * .3, 8.7 + b.dist * .3), 1.2);

// ===========================================================================
// SOUND CUES
// ===========================================================================
const SFX = []; const cue = (t, type, extra = {}) => SFX.push({ t, type, ...extra });
cue(0, "riser", { dur: .8 });
[.8, 1.8, 2.8].forEach(x => cue(x, "blip"));
CONFIG.dimStarts.slice(1).forEach((s, i) => { cue(s - .3, "whoosh", { dur: .5, soft: true }); cue(s, "hit", { tone: i + 1 }); });
for (let i = 0; i < 8; i++) cue(8.0 + i * .25, "clock", { p: i % 2 });
CONFIG.costs.forEach((_, i) => cue(10.3 + i * .22, "coin", { p: i }));
cue(10.8, "count", { dur: 1.0 });
cue(12.5, "whoosh", { dur: 1.0 }); cue(12.6, "suck", { dur: 1.35 }); cue(13.95, "impact", { soft: true });
CONFIG.flips.forEach(([ft], i) => { cue(ft, "glitch", { p: i }); cue(ft, "tick", { p: i }); });
cue(18.1, "riser", { dur: .9 }); [18.45, 18.7, 18.85].forEach((x, i) => cue(x, "glitch", { p: 6 + i }));
cue(19.0, "impact"); cue(19.0, "explode"); cue(19.0, "braam", { dur: 4.0 });
CONFIG.words.forEach((_, i) => { cue(19.5 + i - .2, "whoosh", { dur: .25, soft: true }); cue(19.5 + i, "hit"); });
cue(23.5, "riser", { dur: 1.85 }); cue(23.5, "roll", { dur: 1.85 });
cue(25.35, "silence", { dur: .15 });
cue(REV, "impact"); cue(REV, "braam", { dur: 5.0, up: true }); cue(REV + .1, "sparkle");
cue(REV + 1.25, "whoosh", { dur: .5, soft: true }); cue(REV + 1.75, "ding"); cue(REV + 2.0, "sparkle");
cue(REV + 2.7, "whoosh", { dur: .4, soft: true }); cue(REV + 3.4, "pop", { soft: true }); cue(30.2, "blip");

// ===========================================================================
// SCENE A–D: dimensions
// ===========================================================================
function dimLabel(t) {
  const S = CONFIG.dimStarts;
  let i = -1; S.forEach((s, j) => { if (t >= s) i = j; });
  if (i < 0 || t > 12.9) return;
  const s = S[i], k = easeOut5(prog(t, s, s + .45)), out = easeIn(prog(t, 12.4, 12.8));
  ctx.save(); ctx.globalAlpha = 1 - out;
  ctx.translate(90, 200); ctx.scale(lerp(1.35, 1, k), lerp(1.35, 1, k));
  chroma(CONFIG.dims[i][0], 0, 0, `200 150px ${SANS}`, WHITE, 8 * (1 - prog(t, s, s + .6)), "left");
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 - out;
  reveal(CONFIG.dims[i][1], 96, 262, prog(t, s + .15, s + .65), `italic 600 46px ${SERIF}`, ACC, "left");
  for (let j = 0; j < 5; j++) { ctx.fillStyle = j <= i ? ACC : "rgba(255,255,255,0.18)"; ctx.fillRect(96 + j * 34, 292, 24, 4); }
  ctx.restore();
}
let CITY_PTS = null;   // city surface points projected at 12.5 s → start of the particle swarm
function cityPoints() {
  if (CITY_PTS) return CITY_PTS;
  const P = camAt(12.5), R = rng(808), pts = [];
  const all = [{ ...HERO, h: 4 }, ...CITY.map(b => ({ ...b }))];
  while (pts.length < 2600) {
    const b = all[Math.floor(R() * all.length)], f = R();
    const p = f < .4 ? [b.x + (R() - .5) * 2 * b.w, b.h, b.z + (R() - .5) * 2 * b.d]
                     : [b.x + (R() < .5 ? -b.w : b.w), R() * b.h, b.z + (R() - .5) * 2 * b.d];
    const s = P(p); pts.push([s[0], s[1]]);
  }
  return (CITY_PTS = pts);
}
function sceneDims(t) {
  backdrop(t, 1 - prog(t, 12.6, 13.2));
  const P = camAt(t), cityFade = 1 - easeIn(prog(t, 12.45, 12.95));
  ctx.save(); ctx.globalAlpha = cityFade; ctx.lineCap = "round";
  // 1D: the point
  if (t < 4.5) {
    const pk = easeOut(prog(t, .5, 1.3)), [px, py] = P([0, 0, 0]), beat = bump(t % 1, .8, .4);
    glow(px, py, 260, "rgba(230,57,80,0.85)", pk * (.55 + beat * .35) * (1 - prog(t, 3.2, 4.5)));
    flare(px, py, pk * (.35 + beat * .3) * (1 - prog(t, 2.9, 3.4)), .7);
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(px, py, 10 * pk, 0, 6.283); ctx.fill();
  }
  // opener text
  const ok = win(t, 1.0, 2.9, .5, .4);
  if (ok > 0) { ctx.save(); ctx.globalAlpha = ok; reveal(CONFIG.opener, CX, 820, prog(t, 1.0, 1.6), `italic 600 52px ${SERIF}`, WHITE); ctx.restore(); }
  // 2D: plan lines
  const lk = easeInOut(prog(t, 3.0, 4.6));
  if (lk > 0) {
    const out = [[-2, -1.5], [2, -1.5], [2, 1.5], [-2, 1.5]];
    ctx.strokeStyle = WHITE; ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) { const a = out[k], b = out[(k + 1) % 4]; line3(P, [a[0] * lk, 0, a[1] * lk], [b[0] * lk, 0, b[1] * lk]); }
    ctx.strokeStyle = "rgba(244,242,243,0.6)"; ctx.lineWidth = 2;
    WALLS.forEach(([a, b], i) => line3(P, [a[0], 0, a[1]], [b[0], 0, b[1]], easeOut(prog(t, 3.6 + i * .25, 4.6 + i * .25))));
    // dimension lines (blueprint feel)
    const dk = win(t, 4.2, 6.6, .5, .5);
    if (dk > 0) {
      ctx.save(); ctx.globalAlpha = dk; ctx.strokeStyle = ACC; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      line3(P, [-2, 0, -2.1], [2, 0, -2.1]); line3(P, [2.6, 0, -1.5], [2.6, 0, 1.5]);
      ctx.setLineDash([]); ctx.font = `600 22px ${SANS}`; ctx.fillStyle = ACC; ctx.textAlign = "center";
      const a = P([0, 0, -2.4]), b = P([3.0, 0, 0]);
      ctx.fillText("24,00 m", a[0], a[1]); ctx.fillText("18,00 m", b[0], b[1]);
      ctx.restore();
    }
  }
  // 3D/4D/5D: city + hero, painter-sorted
  if (t > 6.0) {
    const items = CITY.map(b => ({ b, h: cityH(b, t), depth: P([b.x, 0, b.z])[2] }));
    items.push({ b: HERO, h: heroH(t), depth: P([0, 0, 0])[2], hero: true });
    items.sort((p, q) => q.depth - p.depth);
    for (const it of items) {
      if (it.h <= .001) continue;
      const costGlow = it.b.cost >= 0 ? easeOut(prog(t, 10.3 + it.b.cost * .22, 10.6 + it.b.cost * .22)) * .55 : 0;
      drawBox(P, it.b, it.h, it.hero ? { edge: WHITE, lw: 2.4, top: "#25212c", topGlow: .25 * win(t, 8, 12.4) } : { topGlow: costGlow, edge: costGlow > 0 ? "rgba(230,57,80,0.9)" : "rgba(244,242,243,0.5)" });
      if (it.hero && it.h > .05) {
        // floors + interior walls on top
        ctx.strokeStyle = "rgba(244,242,243,0.35)"; ctx.lineWidth = 1.2;
        WALLS.forEach(([a, b]) => line3(P, [a[0], it.h, a[1]], [b[0], it.h, b[1]]));
        for (let f = 1; f < 4; f++) if (f < it.h) { ctx.strokeStyle = "rgba(230,57,80,0.7)"; const pts = [[-2, f, -1.5], [2, f, -1.5], [2, f, 1.5], [-2, f, 1.5]].map(P); polyPts(pts); ctx.stroke(); }
      }
    }
    // 4D: calendar weeks counter
    const ck = win(t, 8.0, 10.3, .3, .3);
    if (ck > 0) {
      const kw = Math.max(1, Math.round(52 * easeInOut(prog(t, 8.0, 10.0))));
      ctx.save(); ctx.globalAlpha = ck;
      ctx.font = `600 22px ${SANS}`; ctx.fillStyle = MUTED; ctx.textAlign = "right"; ctx.fillText("BAUZEIT", 990, 110);
      chroma(`KW ${String(kw).padStart(2, "0")}`, 990, 178, `200 72px ${SANS}`, WHITE, 0, "right");
      ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(760, 196, 230, 3);
      ctx.fillStyle = ACC; ctx.fillRect(760, 196, 230 * kw / 52, 3);
      ctx.restore();
    }
    // 5D: cost labels on the tall buildings + S-curve + total
    CITY.filter(b => b.cost >= 0).forEach(b => {
      const k = easeBack(prog(t, 10.3 + b.cost * .22, 10.65 + b.cost * .22), 2) * (1 - prog(t, 12.2, 12.5));
      if (k <= 0) return;
      const [sx, sy] = P([b.x, cityH(b, t), b.z]);

  return [a * Math.sin(t * 91.3) * Math.cos(t * 17.1), a * Math.cos(t * 83.7) * Math.sin(t * 23.9), a * .0014 * Math.sin(t * 61)];

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over"; ctx.letterSpacing = "0px";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const [sx, sy, sr] = shake(t);
  ctx.save(); ctx.translate(CX + sx, CY + sy); ctx.rotate(sr); ctx.translate(-CX, -CY);
  if (t < 12.5) sceneDims(t);
  else if (t < 19.0) { if (t < 13.0) sceneDims(t); if (t < 13.0) { ctx.save(); ctx.globalAlpha = prog(t, 12.45, 12.8); sceneLogo(t); ctx.restore(); } else sceneLogo(t); }
  else if (t < 25.35) { sceneHyper(t); if (t < 20.4) sceneShatter(t); }
  else if (t < REV) fill("#000");

    const k = easeOut(prog(t, 24.85, 25.25));
    ctx.save(); ctx.strokeStyle = ACC; ctx.lineWidth = 12; ctx.shadowColor = ACC; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(CX, 520, 46 * k, -Math.PI / 2, -Math.PI / 2 + 6.283 * k); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  vignette(t > REV ? .5 : .65);
  for (const [h, a, d] of [[13.95, .35, .45], [19.0, .55, .3], [REV, 1, .45]]) {
    const f = (1 - prog(t, h, h + d)) * a;
    if (t >= h && f > 0) { ctx.fillStyle = `rgba(255,236,240,${f})`; ctx.fillRect(0, 0, W, H); }
  }
  const fade = Math.max(1 - prog(t, 0, .5), prog(t, 31.4, 32));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

const acc = document.getElementById("acc"), actx = acc.getContext("2d");
function renderFrame(t, fps = 60, samples = 6, shutter = .55) {
  if (samples <= 1) { render(t); return cv.toDataURL("image/png").split(",")[1]; }
  actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  for (let i = 0; i < samples; i++) {
    const st = Math.min(DURATION - 1e-4, Math.max(0, t + (i / (samples - 1) - .5) * shutter / fps));
    render(st); actx.globalAlpha = 1 / (i + 1); actx.drawImage(cv, 0, 0);
  }
  return acc.toDataURL("image/png").split(",")[1];
}
window.render = render; window.renderFrame = renderFrame; window.DURATION = DURATION; window.SFX = SFX; window.MUSIC = "reveal2";
window.ready = Promise.all([
  document.fonts.load(`300 40px ${SANS}`), document.fonts.load(`800 40px ${SANS}`), document.fonts.load(`200 40px ${SANS}`),
  document.fonts.load(`600 40px ${SANS}`), document.fonts.load(`italic 600 40px ${SERIF}`),
]).then(() => document.fonts.ready);
if (!location.search.includes("render")) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
